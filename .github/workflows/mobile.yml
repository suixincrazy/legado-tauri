name: Mobile builds
on:
  push:
    branches: [main]
    tags: ['legado_app_*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify JVM source contracts
        run: |
          mkdir -p /tmp/legado-java
          curl -fL https://repo.maven.apache.org/maven2/org/mozilla/rhino/1.8.0/rhino-1.8.0.jar -o /tmp/legado-java/rhino.jar
          curl -fL https://repo.maven.apache.org/maven2/org/jsoup/jsoup/1.16.2/jsoup-1.16.2.jar -o /tmp/legado-java/jsoup.jar
          curl -fL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/legado-java/json.jar
          curl -fL https://repo.maven.apache.org/maven2/cn/hutool/hutool-all/5.8.22/hutool-all-5.8.22.jar -o /tmp/legado-java/hutool.jar
          javac -encoding UTF-8 -cp '/tmp/legado-java/*' -d /tmp/legado-java/classes mobile/android/JavaBridgeEngine.java scripts/JavaBridgeContractTest.java
          java -cp '/tmp/legado-java/classes:/tmp/legado-java/*' JavaBridgeContractTest
  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm run tauri -- android init --ci
      - run: node scripts/prepare-mobile.mjs
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "legado-release.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))'
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/legado-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --target armv7 aarch64 x86_64 --split-per-abi --apk
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112401-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios:
    runs-on: macos-15-intel
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-15-intel-xcode
      - run: command -v xcodegen || brew install xcodegen
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - name: Build unsigned iPad device IPA
        run: |
          mkdir -p artifacts
          npm run tauri -- ios build --target aarch64 --no-sign
          IPA=$(find src-tauri/gen/apple -type f -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" artifacts/legado_app_3.26112401-ios-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent src-tauri/gen/apple artifacts/legado_app_3.26112401-xcode-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112401-ios
          path: artifacts/*
  release-assets:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload verified build files to release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for ABI in armeabi-v7a arm64-v8a x86_64; do
            APK=$(find artifacts -type f -name "*$ABI*.apk" | head -1)
            test -n "$APK"
            cp "$APK" "release/legado_app_3.26112401-android-$ABI.apk"
          done
          find artifacts -type f \( -name '*.ipa' -o -name '*xcode-project.zip' \) -exec cp {} release/ \;
          cp docs/UPSTREAM_REVIEW.md docs/VALIDATION.md release/
          (cd release && sha256sum *.apk *.ipa *.zip > SHA256SUMS.txt)
          gh release view legado_app_3.26112401 || gh release create legado_app_3.26112401 --draft --target main --title '阅读 legado_app_3.26112401' --notes 'See README and validation report.'
          gh release upload legado_app_3.26112401 release/* --clobber
