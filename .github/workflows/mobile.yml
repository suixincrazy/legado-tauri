name: Mobile builds
on:
  push:
    branches: [main]
    tags: ['legado_app_*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm run tauri -- android init --ci
      - run: node scripts/prepare-mobile.mjs
      - run: npm run tauri -- android build --debug --target aarch64 x86_64 --apk
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112301-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios:
    runs-on: macos-15
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: command -v xcodegen || brew install xcodegen
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - name: Build iPad simulator application
        run: npm run tauri -- ios build --debug --target aarch64-sim --no-sign
      - name: Package simulator and Xcode project
        run: |
          mkdir -p artifacts
          APP=$(find src-tauri/gen/apple -type d -name '*.app' | head -1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/legado_app_3.26112301-ipad-simulator.zip
          ditto -c -k --sequesterRsrc --keepParent src-tauri/gen/apple artifacts/legado_app_3.26112301-xcode-project.zip
      - name: Build unsigned iPad device IPA
        run: |
          npm run tauri -- ios build --target aarch64 --no-sign
          IPA=$(find src-tauri/gen/apple -type f -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" artifacts/legado_app_3.26112301-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112301-ios
          path: artifacts/*
