name: Mobile builds
on:
  push:
    branches: [main]
    tags: ['legado_app_*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: /tmp/legado-java/*.jar
          key: source-jvm-rhino-1.7.15-jsoup-1.16.2-json-20240303-hutool-5.8.22-jsonpath-2.9.0
      - name: Verify JVM source contracts
        run: |
          mkdir -p /tmp/legado-java
          download_jar() {
            if test -s "/tmp/legado-java/$2.jar"; then return; fi
            for repository in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2; do
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 "$repository/$1" -o "/tmp/legado-java/$2.jar"; then return; fi
            done
            return 1
          }
          download_jar org/mozilla/rhino/1.7.15/rhino-1.7.15.jar rhino
          download_jar org/jsoup/jsoup/1.16.2/jsoup-1.16.2.jar jsoup
          download_jar org/json/json/20240303/json-20240303.jar json
          download_jar cn/hutool/hutool-all/5.8.22/hutool-all-5.8.22.jar hutool
          download_jar com/jayway/jsonpath/json-path/2.9.0/json-path-2.9.0.jar json-path
          download_jar net/minidev/json-smart/2.5.0/json-smart-2.5.0.jar json-smart
          download_jar net/minidev/accessors-smart/2.5.0/accessors-smart-2.5.0.jar accessors-smart
          download_jar org/ow2/asm/asm/9.3/asm-9.3.jar asm
          download_jar org/slf4j/slf4j-api/2.0.11/slf4j-api-2.0.11.jar slf4j-api
          javac -encoding UTF-8 -cp '/tmp/legado-java/*' -d /tmp/legado-java/classes mobile/android/JavaBridgeEngine.java scripts/JavaBridgeContractTest.java
          java -cp '/tmp/legado-java/classes:/tmp/legado-java/*' JavaBridgeContractTest
          LEGADO_JAVA_CP='/tmp/legado-java/classes:/tmp/legado-java/*' npx vitest run src/source-native.test.ts
  android:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi,aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm run tauri -- android init --ci
      - run: node scripts/prepare-mobile.mjs
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "legado-release.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"]))'
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/legado-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri -- android build --target armv7 aarch64 x86_64 --split-per-abi --apk
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112703-android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
  ios:
    runs-on: macos-15-intel
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: macos-15-intel-xcode
      - run: command -v xcodegen || brew install xcodegen
      - run: npm ci
      - run: npm run tauri -- ios init --ci
      - run: node scripts/prepare-ios.mjs
      - name: Build unsigned iPad device IPA
        run: |
          mkdir -p artifacts
          npm run tauri -- ios build --target aarch64 --no-sign
          node scripts/prepare-ios.mjs --check
          IPA=$(find src-tauri/gen/apple -type f -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" artifacts/legado_app_3.26112703-ios-unsigned.ipa
          ditto -c -k --sequesterRsrc --keepParent src-tauri/gen/apple artifacts/legado_app_3.26112703-xcode-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: legado_app_3.26112703-ios
          path: artifacts/*
  release-assets:
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload verified build files to release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for PAIR in arm:armeabi-v7a arm64:arm64-v8a x86_64:x86_64; do
            FLAVOR=${PAIR%:*}
            ABI=${PAIR#*:}
            APK=$(find artifacts -type f -name "app-$FLAVOR-release.apk" | head -1)
            test -n "$APK"
            cp "$APK" "release/legado_app_3.26112703-android-$ABI.apk"
          done
          find artifacts -type f \( -name '*.ipa' -o -name '*xcode-project.zip' \) -exec cp {} release/ \;
          cp docs/UPSTREAM_REVIEW.md docs/VALIDATION.md docs/audit/COVERAGE.md release/
          (cd release && sha256sum *.apk *.ipa *.zip > SHA256SUMS.txt)
          gh release view legado_app_3.26112703 || gh release create legado_app_3.26112703 --draft --target main --title '阅读 legado_app_3.26112703' --notes 'See README and validation report.'
          gh release upload legado_app_3.26112703 release/* --clobber
